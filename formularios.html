<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <H1>Formulario de registro</H1>
<form action="">
    <label for="nom">Nombre:</label> <br>
    <input type="text" name="" id="Nombre"> <br>
    <label for="Apellidos">Apellidos:</label> <br>
    <input type="tel" name="Apellidos" id="Apellidos"> <br>
    <label for="Email">Email:</label> <br>
    <input type="email" name="Email" id="Email" required placeholder="nom@exemple.com"> <br>
    <label for="Contraseña:">Contraseña:</label><br>
    <input type="password" name="Contraseña" id="Contraseña"> <br>
    <label for="Fecha_nacimineto">Fecha de nacimineto:</label><br>
    <input type="date" name="Fecha_nacimineto" id="Fecha_nacimineto"><br>
    <label for="">Género:</label> <br>
    <input type="radio" name="Género" id="Hombre">
    <label for="Hombre">Hombre</label>
    <input type="radio" name="Género" id="Mujer">
    <label for="Hombre">Mujer</label>
    <input type="radio" name="Género" id="Otros">
    <label for="Otros">Otros</label> <br>
    <label for="País">País de Residencia</label>
    <select name="País" id="País">
    <option value="">Selecciona un país</option>
    <option value="ES">España</option>
    <option value="IT">Itália</option><option value="FR">Francia</option>
   <option value="RO">Rumanía</option><option value="AL">Alemania</option>
    </select> <br>
    <label for="">Tecnología</label>
    <input type="checkbox" name="intereses" id="tecnología">
    <label for="">Música</label>
    <input type="checkbox" name="intereses" id="Música">    <label for="">Deportes</label>
    <input type="checkbox" name="intereses" id="Deportes"> <br>
    <label for="mensaje">Comentarios adicionales</label> <br>
    <textarea name="mensaje" id="mensaje" rows="4" cols="40" placeholder="Escribe aquí tu mensaje"></textarea> <br>
    <button type="submit">Enviar</button>
    <button type="reset">Limpiar Formulario</button>
</form>

</body>
</html>
